<style>
:root{
  --ink:#0C1016; --panel:#141A22; --panel2:#1B222C; --line:#2A3440;
  --text:#DCE3EA; --dim:#7D8B99; --dimmer:#4A5865;
  --common:#7E9B76; --uncommon:#6B8CB0; --rare:#9B7BC4;
  --regional:#D19A4A; --ultra:#D96B6B; --ancient:#E3C567; --shiny:#8FE3D8;
  --tree:#8FBF7F; --shell:#C9A2C4; --gem:#6FC4D9; --bird:#E0A458; --car:#C77B94; --boat:#6FA8C7;
  --phos:#8FBF7F;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* conditions header */
.cond{margin:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;gap:14px}
.cond .ico{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--panel2)}
.cond .col{flex:1;min-width:0}
.cond .val{font-family:'Fraunces',serif;font-size:17px;color:var(--phos);line-height:1.2;margin-top:2px}
.cond .sub{font-size:11px;color:var(--dim);margin-top:3px;display:flex;align-items:center;gap:5px}
.cond .div{width:1px;background:var(--line)}
.cond .wx{text-align:right}
.cond .wx .val{color:var(--gem)}

/* radar */
.radarwrap{position:relative;margin:0 12px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#080C11;border:1px solid var(--line)}
.radarwrap svg.map{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.radarwrap svg.grid{position:absolute;inset:0;width:100%;height:100%}
.sweep{position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:0;
  background:conic-gradient(from 0deg,rgba(143,191,127,.42) 0deg,rgba(143,191,127,.10) 34deg,transparent 62deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,#000 0 47%,transparent 47.5%);
  mask:radial-gradient(circle at 50% 50%,#000 0 47%,transparent 47.5%)}
.scanning .sweep{opacity:1;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;border:1px solid var(--phos);opacity:0;transform:translate(-50%,-50%)}
.scanning .pulse{animation:ping 3.2s ease-out infinite}
@keyframes ping{0%{width:26%;height:26%;opacity:.55}100%{width:96%;height:96%;opacity:0}}

.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#151E27,#0A0F14);border:1px solid rgba(143,191,127,.45);
  display:flex;align-items:center;justify-content:center;z-index:1;transition:box-shadow .3s}
.scanning .hub{box-shadow:0 0 30px -4px rgba(143,191,127,.6)}
.orbtxt{font-family:'Fraunces',serif;font-size:14px;letter-spacing:.03em;color:var(--phos)}
.nav .mid .orb{transition:transform .18s,box-shadow .18s}
.nav .mid:active .orb{transform:scale(.93)}
.nav .mid[disabled] .orb{opacity:.35;border-color:var(--dimmer);box-shadow:none}
.nav .mid[disabled] .orbtxt{color:var(--dimmer)}
.nav .mid.armed .orb{animation:armed 1.9s ease-in-out infinite}
@keyframes armed{0%,100%{box-shadow:0 0 20px -4px rgba(143,191,127,.6)}50%{box-shadow:0 0 30px -2px rgba(143,191,127,.95)}}

/* blips */
.blip{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.3);transition:opacity .6s,transform 1s cubic-bezier(.4,0,.2,1),left 1.15s cubic-bezier(.5,0,.5,1),top 1.15s cubic-bezier(.5,0,.5,1);z-index:2}
.blip.on{opacity:1;transform:scale(1)}
.blip.mystery{width:30px;height:30px;margin:-15px 0 0 -15px;font-family:'Fraunces',serif;font-size:17px;font-weight:700}
.blip svg{display:block}

/* status strip */
.strip{margin:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:14px}
.strip h3{font-size:14px;color:var(--phos);letter-spacing:.04em;text-transform:uppercase;font-family:'IBM Plex Sans';font-weight:600}
.strip p{font-size:12px;color:var(--dim);margin-top:3px}
.ring{width:62px;height:62px;flex-shrink:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring svg{position:absolute;inset:0}
.ring b{font-family:'IBM Plex Mono',monospace;font-size:14px}
.ring span{font-size:7.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* results sheet */
.sheet{position:fixed;inset:0;background:rgba(6,9,13,.9);z-index:48;display:flex;align-items:flex-end;justify-content:center}
.sheetcard{width:100%;max-width:430px;max-height:90vh;display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line);border-radius:18px 18px 0 0;animation:up .34s cubic-bezier(.16,.84,.34,1) both;position:relative}
.sheettop{padding:22px 18px 4px;flex-shrink:0}
.sheetbody{padding:0 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.sheetfoot{padding:12px 18px calc(16px + env(safe-area-inset-bottom));flex-shrink:0;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 0 0}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheetcard h2{font-size:22px;margin:4px 0 2px}
.sheetcard .lede{font-size:12.5px;color:var(--dim);margin-bottom:16px}
.grp{margin-bottom:16px}
.grp .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.grp .hd b{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.grp .hd i{flex:1;height:1px;background:var(--line)}
.grp .hd span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dimmer)}
.find{display:flex;align-items:center;gap:10px;padding:7px 0}
.find .nm{font-size:13.5px}
.find .new{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.1em;color:var(--ink);background:var(--shiny);padding:2px 5px;border-radius:3px}
.find .x{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dimmer)}
.primary{width:100%;padding:15px;border-radius:10px;background:#25333F;border:1px solid #3D5163;font-weight:600;font-size:14.5px}
.primary.glow{border-color:var(--phos);box-shadow:0 0 0 1px rgba(143,191,127,.25)}

/* rare reveal */
.burst{position:fixed;inset:0;background:rgba(6,9,13,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.bcard{position:relative;width:100%;max-width:340px;text-align:center;padding:38px 26px 26px;border-radius:14px;
  background:var(--panel);border:1px solid var(--rc);overflow:hidden;box-shadow:0 24px 70px -20px var(--rc);
  animation:rise .42s cubic-bezier(.16,.84,.34,1) both}
.bcard::before{content:'';pointer-events:none;position:absolute;left:50%;top:36%;width:460px;height:460px;margin:-230px 0 0 -230px;
  background:conic-gradient(from 0deg,transparent 0 7deg,var(--rc) 7deg 8deg,transparent 8deg 20deg);opacity:.13;animation:spin2 26s linear infinite}
.bcard::after{content:'';pointer-events:none;position:absolute;left:50%;top:36%;width:300px;height:300px;margin:-150px 0 0 -150px;
  background:radial-gradient(circle,var(--rc) 0%,transparent 68%);opacity:.16}
.bcard>*{position:relative;z-index:1}
@keyframes spin2{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.b-badge{display:flex;justify-content:center;margin-bottom:14px}
.b-tier{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--rc)}
.b-name{font-family:'Fraunces',serif;font-size:26px;line-height:1.15;margin:12px 0 4px}
.b-sci{font-style:italic;color:var(--dim);font-size:12px;min-height:1em}
.b-meta{margin-top:14px;font-size:11.5px;color:var(--dim);display:flex;gap:7px;justify-content:center;flex-wrap:wrap;align-items:center}
.b-odds{margin-top:11px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim)}
.bcard button:not(.closex){margin-top:20px;width:100%;padding:12px;border:1px solid var(--rc);border-radius:9px;font-weight:600}
.b-count{margin-top:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;color:var(--dimmer)}

/* collection panel */
.panel{position:fixed;inset:0;background:var(--ink);z-index:50;overflow-y:auto;padding:16px 14px 90px}
#itemHost .sheet{z-index:56}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.phead h2{font-size:21px;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border-right:1px solid var(--line);padding:7px 11px;font-size:12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:#2A3644;color:#fff}
.tier{margin-bottom:16px}
.tierhd{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.tierhd .nm{font-family:'Fraunces',serif;font-size:14px}
.tierhd .ct{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);margin-left:auto}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:9px}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:inherit;font-size:11px;padding:5px 9px;border-radius:4px;border:1px solid var(--line);color:var(--dimmer)}
.chip:active{border-color:var(--dim)}
.chip.haspic{padding-left:4px;display:inline-flex;align-items:center;gap:5px}
.cthumb{width:18px;height:18px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.chip.shinychip{box-shadow:0 0 0 2px var(--shiny),0 0 12px -2px var(--shiny)}
.shmark{color:var(--shiny);font-size:11px;margin-left:4px;text-shadow:0 0 6px var(--shiny)}
.chip.own .shmark{color:var(--ink);text-shadow:none}
.shcount{color:var(--shiny)}
.shinybar{margin-top:10px;padding:9px 12px;border-radius:8px;background:rgba(143,227,216,.09);
  border:1px solid rgba(143,227,216,.4);font-size:12.5px;color:var(--shiny);display:flex;align-items:center;gap:6px}
.shinybar .shmark{margin-left:0;font-size:14px;color:var(--shiny)}
.ownline{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);margin-top:12px}
.oddsbox{margin:14px 0 4px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.oddsbox b{font-family:'IBM Plex Mono',monospace}
.oddsbox span{color:var(--dimmer);font-size:11px}
ul.hints{list-style:none;margin:8px 0 4px;padding:0}
ul.hints li{position:relative;padding:9px 0 9px 17px;border-top:1px solid var(--line);font-size:13px}
ul.hints li::before{content:'';position:absolute;left:2px;top:16px;width:5px;height:5px;border-radius:50%;background:var(--dimmer)}
.loghd{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}
.loghd b{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.loghd span{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dimmer)}
.logempty{margin-top:18px;font-size:12.5px;color:var(--dimmer)}
ol.caplog{list-style:none;margin:0;padding:0}
ol.caplog li{position:relative;padding:10px 0 10px 16px;border-top:1px solid var(--line)}
ol.caplog li::before{content:'';position:absolute;left:3px;top:17px;width:5px;height:5px;border-radius:50%;
  background:var(--dimmer);box-shadow:0 0 0 3px var(--panel)}
ol.caplog li::after{content:'';position:absolute;left:5px;top:22px;bottom:-10px;width:1px;background:var(--line)}
ol.caplog li:last-child::after{display:none}
ol.caplog li.shl::before{background:var(--shiny);box-shadow:0 0 8px 0 var(--shiny)}
.capn{font-size:13px;font-weight:500}
.capd{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--dim);margin-top:2px}
.capc{font-size:11.5px;color:var(--dimmer);margin-top:3px}
.chip.own{color:var(--ink);font-weight:600}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:45;
  background:rgba(12,16,22,.96);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:9px 6px 14px;backdrop-filter:blur(10px)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dimmer);font-family:'IBM Plex Mono',monospace}
.nav button.on{color:var(--phos)}
.nav .mid{flex:0 0 62px;margin-top:-26px}
.nav .mid .orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1C2630,#0D1319);
  border:2px solid var(--phos);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px -4px rgba(143,191,127,.6)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  border-radius:8px;padding:9px 15px;font-size:12px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.closex{position:absolute;top:10px;right:10px;width:32px;height:32px;min-width:32px;padding:0;margin:0;border-radius:50%;
  font-size:21px;line-height:1;color:var(--dim);background:rgba(27,34,44,.9);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;z-index:6}
.closex:active{background:#232C38}
.sheetcard{position:relative}
.domrow{display:block;width:100%;text-align:left;position:relative;padding:14px 16px;margin-bottom:9px;border-radius:11px;
  background:var(--panel);border:1px solid var(--line)}
.domrow.on{border-color:var(--phos);box-shadow:0 0 0 1px rgba(143,191,127,.2)}

function resetModeState(){
  owned={}; shinies={}; logs={};
  for(const k of Object.keys(ITEMS)){owned[k]={};shinies[k]={};logs[k]={}}
  foundToday=0;
  DOMAIN='Nature'; CATS=DOMAINS[DOMAIN]; CONT='Europe';
  cond=null;
  TRIP.walked=0; TRIP.lastScan=Date.now();
}
function updateModeBanner(){
  const el=document.getElementById('modeBanner');
  if(el)el.textContent=HUNTMODE==='hard'?'Hard Mode':'Normal Mode';
}
setTimeout(updateModeBanner,0);
function switchModeSave(){
  try{
    clearTierCache();
    resetModeState();
    load();
    if(!cond)cond=newConditions();
    render();
    draw();
  }catch(e){ console.error('switchModeSave',e); }
}

function hardAreaWeights(cat, item){
  if(HUNTMODE!=='hard') return null;
  if(cat==='Shells') return HARD_AREA.Shells.SHELL.slice();
  const arch=item&&item[AR];
  const row=(HARD_AREA[cat]||{})[arch];
  return row?row.slice():null;
}

/* ---- distance ---- */
function haversine(a,b){
  const R=6371000,t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  const la1=a.lat*t,la2=b.lat*t;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ---- weather: Open-Meteo ---- */
async function fetchWeather(lat,lon){
  const url='https://api.open-meteo.com/v1/forecast?latitude='+lat.toFixed(3)+'&longitude='+lon.toFixed(3)
    +'&current=temperature_2m,precipitation,snowfall,weather_code,wind_speed_10m'
    +'&daily=precipitation_sum&past_days=3&timezone=auto';
  const r=await fetch(url);
  if(!r.ok)throw new Error('weather '+r.status);
  const j=await r.json(), c=j.current||{};
  const past=(j.daily&&j.daily.precipitation_sum||[]).slice(0,3);
  const dry=past.length===3&&past.every(v=>(v||0)<0.5);
  const code=Number(c.weather_code);
  let wx='Clear';
  if([71,73,75,77,85,86].includes(code) || (c.snowfall||0)>0) wx='Snow';
  else if((code>=51&&code<=67) || (code>=80&&code<=82) || (code>=95&&code<=99) || (c.precipitation||0)>0.1) wx='Wet';
  else if((c.temperature_2m||0)>=28 || ((c.temperature_2m||0)>=22&&dry)) wx='Extreme';
  else if((c.temperature_2m||0)<=0) wx='Snow';           // hard frost reads as snow
  return {wx,temp:c.temperature_2m,precip:c.precipitation,snow:c.snowfall,
          wind:c.wind_speed_10m,code:c.weather_code,dry};
}

  [-30,-19,119,142], // Australian interior (west edge clear of Perth)
  [20,38,-118,-98],  // US southwest + northern Mexico
  [-30,-14,-72,-62], // Atacama / Puna
  [30,42,-10,-1]     // south-east Iberia
];
const MED_BANDS=[
  [30,46,-10,42],    // Mediterranean basin
  [30,42,-125,-115], // California
  [-38,-30,15,26],   // Cape
  [-39,-30,-73,-69], // central Chile
  [-38,-30,114,150]  // southern Australia
];
function inBand(lat,lon,b){return lat>=b[0]&&lat<=b[1]&&lon>=b[2]&&lon<=b[3]}
function classifyBiome(lat,lon,elev){
  const a=Math.abs(lat);
  if(elev>2200) return 'Cold';                       // alpine overrides latitude
  if(ARID_BANDS.some(b=>inBand(lat,lon,b))) return 'Arid';
  if(a<=23.5) return 'Tropical';
  if(MED_BANDS.some(b=>inBand(lat,lon,b))) return 'Mediterranean';
  if(a>=55) return 'Cold';
  if(a>=48) return (lon>20&&lon<180)?'Cold':'Temperate';   // continental interiors run colder
  return 'Temperate';
}

/* ---- area: simulated until stage 4 ---- */
const AREA_SIM={Urban:.20,Forest:.18,Cultivated:.15,'Open Land':.13,Coast:.09,Wetland:.07,Barren:.06,Mountain:.06,Water:.06};
function simulateArea(){let r=Math.random(),c=0;for(const k in AREA_SIM){c+=AREA_SIM[k];if(r<c)return k}return 'Urban'}

/* ============================================================
   REAL AREA  —  OpenStreetMap via Overpass, cached by geohash
   Falls back quietly: enclosing polygon -> nearby feature ->
   neighbouring cell -> previous area -> simulated.
   ============================================================ */
const AREA_CACHE_KEY='worldhunt:area:v1';
const GEO32='0123456789bcdefghjkmnpqrstuvwxyz';
function geohash(lat,lon,prec){
  let idx=0,bit=0,even=true,hash='';
  let latR=[-90,90],lonR=[-180,180];
  while(hash.length<prec){
    if(even){const m=(lonR[0]+lonR[1])/2; if(lon>m){idx=idx*2+1;lonR[0]=m}else{idx*=2;lonR[1]=m}}
    else{const m=(latR[0]+latR[1])/2; if(lat>m){idx=idx*2+1;latR[0]=m}else{idx*=2;latR[1]=m}}
    even=!even;
    if(++bit===5){hash+=GEO32[idx];bit=0;idx=0}
  }
  return hash;
}
let areaCache={};
try{areaCache=JSON.parse(localStorage.getItem(AREA_CACHE_KEY)||'{}')}catch(e){areaCache={}}
function cachePut(k,v){
  areaCache[k]={a:v,t:Date.now()};
  const keys=Object.keys(areaCache);
  if(keys.length>800){                      // keep the most recent 800 cells
    keys.sort((x,y)=>areaCache[x].t-areaCache[y].t).slice(0,keys.length-800).forEach(k2=>delete areaCache[k2]);
  }
  try{localStorage.setItem(AREA_CACHE_KEY,JSON.stringify(areaCache))}catch(e){}
}

/* ---- tag -> Area, with the size of the matched feature for precedence ---- */
function tagsToArea(t){
  if(!t)return null;
  const L=t.landuse,N=t.natural,W=t.waterway,LE=t.leisure,P=t.place;
  if(N==='water'||N==='bay'||N==='strait'||W==='riverbank'||L==='reservoir')return 'Water';
  if(N==='wetland'||N==='marsh'||N==='mud'||L==='basin'||L==='salt_pond')return 'Wetland';
  if(N==='beach'||N==='shingle'||N==='coastline'||t.man_made==='pier')return 'Coast';
  if(N==='wood'||L==='forest')return 'Forest';
  if(LE==='garden'||LE==='pitch'||LE==='track'||LE==='playground'||LE==='sports_centre')return 'Urban';
  if(L==='farmland'||L==='orchard'||L==='vineyard'||L==='meadow'||L==='allotments'||L==='farmyard'
     ||LE==='park'||LE==='golf_course'||LE==='recreation_ground'||LE==='common'
     ||L==='greenfield'||L==='plant_nursery')return 'Cultivated';
  if(N==='bare_rock'||N==='scree'||N==='sand'||N==='rock'||N==='cliff'||L==='quarry'||L==='landfill')return 'Barren';
  if(N==='grassland'||N==='heath'||N==='scrub'||N==='fell'||N==='moor'||L==='grass'||L==='village_green')return 'Open Land';
  if(N==='peak'||N==='ridge'||N==='saddle'||N==='glacier')return 'Mountain';
  if(L==='residential'||L==='commercial'||L==='industrial'||L==='retail'||L==='education'
     ||L==='institutional'||L==='garages'||L==='railway'||P==='city'||P==='town'||P==='suburb'
     ||P==='neighbourhood'||P==='village')return 'Urban';
  if(t.building)return 'Urban';
  return null;
}
const AREA_RANK={Water:0,Wetland:1,Coast:2,Forest:3,Cultivated:4,Barren:5,'Open Land':6,Mountain:7,Urban:8};

/* ---- Overpass ---- */
const OVERPASS=[
  '/api/overpass',                                             // our own server-side proxy
  'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.private.coffee/api/interpreter',
  'https://overpass.osm.ch/api/interpreter'                    // Switzerland only, last resort
];
let lastQuery=0, overpassCooldown=0, OVERLOG=[];
function hostOf(u){
  try{ return new URL(u,(typeof location!=='undefined'&&location.href)||'https://x/').hostname||'api' }
  catch(e){ return u.startsWith('/')?'api':'unknown' }
}
async function queryArea(lat,lon,force){
  const now=Date.now();
  if(!force){
    if(now<overpassCooldown) throw new Error('cooling down');
    if(now-lastQuery<20000) throw new Error('throttled');
  }
  lastQuery=now;
  const q=`[out:json][timeout:20];
is_in(${lat},${lon});
out tags;
(way(around:120,${lat},${lon})["natural"];
 way(around:120,${lat},${lon})["waterway"];
 way(around:120,${lat},${lon})["landuse"];
 way(around:120,${lat},${lon})["leisure"];);
out tags 30;`;
  OVERLOG=[];
  for(const url of OVERPASS){
    const host=url.startsWith('/')?'api':hostOf(url);
    try{
      const r=await fetch(url+'?data='+encodeURIComponent(q),{mode:'cors',credentials:'omit'});
      if(r.status===429||r.status===504){OVERLOG.push(host+' '+r.status+' rate-limited');overpassCooldown=Date.now()+120000;continue}
      if(!r.ok){OVERLOG.push(host+' HTTP '+r.status);continue}
      const j=await r.json();
      OVERLOG.push(host+' ok, '+((j.elements||[]).length)+' elements');
      const seen=[];
      const hits=(j.elements||[]).map(e=>{
        const a=tagsToArea(e.tags);
        if(a){const t=e.tags;
          const k=['natural','landuse','leisure','waterway','place'].find(x=>t[x]);
          seen.push((k?k+'='+t[k]:'building')+'→'+a);}
        return a;
      }).filter(Boolean);
      if(!hits.length){ OVERLOG.push(host+' returned nothing usable'); continue; }   // try the next mirror
      hits.sort((x,y)=>AREA_RANK[x]-AREA_RANK[y]);   // water/wetland/coast win outright
      return {area:hits[0],tags:seen.slice(0,6),via:host};
    }catch(e){ OVERLOG.push(host+' '+(e.name||'error')+': '+(e.message||'')); }
  }
  throw new Error(OVERLOG.length?('all mirrors failed'):'overpass unreachable');
}

/* ---- elevation, for Mountain ---- */
const elevCache={};
async function elevationAt(lat,lon){
  const k=lat.toFixed(2)+','+lon.toFixed(2);
  if(k in elevCache)return elevCache[k];
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`);
    const j=await r.json();
    const e=(j.elevation&&j.elevation[0])!=null?j.elevation[0]:null;
    elevCache[k]=e; return e;
  }catch(e){ return null }
}

/* ---- the resolver the app calls ---- */
let lastGoodArea=null;
async function resolveArea(lat,lon,force){
  const cell=geohash(lat,lon,7);
  if(areaCache[cell]&&!force){lastGoodArea=areaCache[cell].a;return {area:lastGoodArea,src:'cache',cell}}
  let area=null,src='osm',tags=[];
  try{ const q=await queryArea(lat,lon,force); if(q){area=q.area;tags=q.tags||[];if(q.via)src='osm via '+q.via.replace(/^(maps\.|overpass[.-])/,'')} }
  catch(e){ src=e.message; }
  const elev=await elevationAt(lat,lon);
  // high ground overrides anything that is not water or built-up
  if(elev!=null&&elev>=600&&(area===null||area==='Open Land'||area==='Barren'||area==='Forest')) area='Mountain';
  if(area){ cachePut(cell,area); lastGoodArea=area; return {area,src,cell,elev,tags}; }
  // neighbouring cell, then last known, then simulated
  const why=src==='osm'?'no match':src;
  const near=Object.keys(areaCache).find(k=>k.slice(0,6)===cell.slice(0,6));
  if(near){lastGoodArea=areaCache[near].a;return {area:lastGoodArea,src:'neighbour ('+why+')',cell,elev,tags}}
  if(lastGoodArea)return {area:lastGoodArea,src:'previous ('+why+')',cell,elev,tags};
  return {area:simulateArea(),src:'simulated ('+why+')',cell,elev,tags};
}

/* ---- continent from lat/long ---- */
function continentOf(lat,lon){
  if(lat>34&&lon>-25&&lon<45)return 'Europe';
  if(lat>-37&&lat<38&&lon>-20&&lon<52)return 'Africa';
  if(lon>=45&&lon<180&&lat>-11)return 'Asia';
  if(lat<-10&&lon>110&&lon<180)return 'Oceania';
  if(lat<13&&lon<-30)return 'South America';
  if(lon<-30)return 'North America';
  return 'Europe';
}

/* ---- resolve everything for a position ---- */
async function resolveConditions(lat,lon,elev,opts={}){
  let areaRes={area:simulateArea(),src:'simulated'};
  if(REALAREA){ try{ areaRes=await resolveArea(lat,lon); }catch(e){ areaRes={area:simulateArea(),src:'failed'} } }
  if(areaRes.elev!=null)elev=areaRes.elev;
  const biome=classifyBiome(lat,lon,elev||0);
  let w=null;
  let err=null;
  if(opts.refreshWeather===false){
    w=LIVEINFO&&LIVEINFO.weather?LIVEINFO.weather:null;
  }else{
    try{ w=await fetchWeather(lat,lon); }catch(e){ err=e.message; }
    if(!w && LIVEINFO&&LIVEINFO.weather) w=LIVEINFO.weather;
  }
  const wx=w?w.wx:(LIVEINFO&&LIVEINFO.weather?LIVEINFO.weather.wx:'Clear');
  // snow only where it can plausibly fall
  const finalWx=(wx==='Snow'&&(biome==='Tropical'||biome==='Arid'))?'Wet':wx;
  return {area:areaRes.area,biome,wx:finalWx,
    _live:{weather:w,err,lat,lon,elev,cont:continentOf(lat,lon),areaSrc:areaRes.src,cell:areaRes.cell,areaTags:areaRes.tags||[]}};
}

/* ============================================================
   SCAN GATE  —  a scan unlocks on distance travelled OR time
   Distance comes from GPS. Step counts need HealthKit / Google Fit,
   which is a native concern, so distance stands in for now.
   ============================================================ */
let FREESCAN=false;   // testing mode: ignore the movement gate
let REALAREA=true;    // live area resolution is now on by default
let FORCEAREA=false;  // next resolve ignores cache and throttle
const GATE={
  metres:50,         // walk this far since the last scan
  minutes:5,         // or wait this long
  minMove:3,         // accept short GPS steps; the accuracy filter below handles jitter
  maxAccuracy:60,    // ignore fixes whose reported accuracy is too poor for short-distance play
  maxJump:120,       // ignore implausible single-fix jumps
  maxSpeed:8.5,      // m/s ~ 30 km/h. Faster than this is a vehicle
  vehicleCredit:0.15 // vehicle movement still counts, but barely
};
const TRIP={walked:0,lastFix:null,lastScan:Date.now(),vehicle:false};

function addFix(lat,lon,t,accuracy){
  const now={lat,lon,t:t||Date.now(),accuracy:Number.isFinite(accuracy)?accuracy:null};
  // A poor fix is not useful for a 50 m game mechanic. Keep the last good
  // anchor rather than allowing GPS drift to manufacture walking distance.
  if(now.accuracy!=null && now.accuracy>GATE.maxAccuracy) return false;
  if(TRIP.lastFix){
    const d=haversine(TRIP.lastFix,now);
    const dt=Math.max(1,(now.t-TRIP.lastFix.t)/1000);
    const speed=d/dt;
    // Reject isolated GPS jumps, but still accept ordinary short walking fixes.
    if(d<=GATE.maxJump && d>=GATE.minMove){
      if(speed>GATE.maxSpeed){ TRIP.walked+=d*GATE.vehicleCredit; TRIP.vehicle=true; }
      else { TRIP.walked+=d; TRIP.vehicle=false; }
    }
  }
  TRIP.lastFix=now;
  return true;
}
function gateProgress(){
  if(FREESCAN)return {p:1,ready:true,walked:TRIP.walked,metresLeft:0,minsLeft:0,leading:'free',vehicle:false,free:true};
  const byDist=Math.min(1,TRIP.walked/GATE.metres);
  const mins=(Date.now()-TRIP.lastScan)/60000;
  const byTime=Math.min(1,mins/GATE.minutes);
  const p=Math.max(byDist,byTime);
  return {p,ready:p>=1,walked:TRIP.walked,
    metresLeft:Math.max(0,Math.round(GATE.metres-TRIP.walked)),
    minsLeft:Math.max(0,Math.ceil(GATE.minutes-mins)),
    leading:byDist>=byTime?'distance':'time',vehicle:TRIP.vehicle};
}
function consumeGate(){TRIP.walked=0;TRIP.lastScan=Date.now()}

/* ---------- engine (same maths as the playtest) ---------- */
const tierCache={};
function clearTierCache(){for(const k in tierCache)delete tierCache[k]}
// Which tiers can this category actually produce right here? Cached per condition set.
function deliverable(cat,c,cont){
  cont=cont||CONT;
  const key=HUNTMODE+'|'+cat+'|'+c.area+'|'+c.biome+'|'+c.wx+'|'+cont;
  if(key in tierCache)return tierCache[key];
  const rows=RAR[cat].filter(row=>{
    const n=row[0], kb=row[2], ka=row[3];
    if(n==='Regional')return ITEMS[cat].some(x=>x[RA]==='Regional'&&x[CO]===cont);
    const pool=ITEMS[cat].filter(x=>x[RA]===n);
    if(!pool.length)return false;
    if(!hasArch(cat))return true;
    return pool.some(x=>weight(cat,x,c,kb,ka)>0);
  });
  return tierCache[key]={rows,mass:rows.reduce((t,r)=>t+r[1],0)};
}
function catWeight(k,c,cont){
  const r=CAT[k];
  const base=r.a[AREA.indexOf(c.area)]*r.b[BIOME.indexOf(c.biome)]*r.w[WEATH.indexOf(c.wx)];
  return base*deliverable(k,c,cont).mass;
}
function catShares(c,cont){
  const w={};let tot=0;
  for(const k of CATS){w[k]=catWeight(k,c,cont);tot+=w[k]}
  if(!tot){const e={};for(const k of CATS)e[k]=1/CATS.length;return e}
  const raw={};for(const k of CATS)raw[k]=w[k]/tot;
  const pin={};
  for(const k of CATS){const L=CAT_LIMITS[k];if(!L)continue;
    if(L.cap!==undefined&&raw[k]>L.cap)pin[k]=L.cap;
    else if(L.floor!==undefined&&raw[k]<L.floor)pin[k]=L.floor}
  const free=CATS.filter(k=>!(k in pin));
  let pinned=0;for(const k in pin)pinned+=pin[k];
  let fr=0;for(const k of free)fr+=raw[k];
  const left=Math.max(0,1-pinned),out={};
  for(const k of CATS)out[k]=(k in pin)?pin[k]:(fr?raw[k]/fr*left:left/Math.max(1,free.length));
  return out;
}
function pickCat(c){const s=catShares(c);let r=Math.random(),a=0;for(const k of CATS){a+=s[k];if(r<a)return k}return CATS[0]}
function hasArch(cat){if(cat==='Shells'&&HUNTMODE!=='hard')return false;return !!(ARCH[cat]&&Object.keys(ARCH[cat]).length)}
function weight(cat,it,c,kb,ka){
  if(it[RA]==='Ancient')return 1;                        // Ancients ignore habitat, by design
  const hardRow=HUNTMODE==='hard'?hardAreaWeights(cat,it):null;
  const archKey=(cat==='Shells'&&HUNTMODE==='hard')?'SHELL':it[AR];
  const a=(ARCH[cat]||{})[archKey];
  const ai=AREA.indexOf(c.area), bi=BIOME.indexOf(c.biome), wi=WEATH.indexOf(c.wx);
  if(!a)return hardRow?(hardRow[ai]||0):0;               // shells have no ARCH row of their own
  const areaWeights=hardRow||a[1];
  const aw=areaWeights[ai]||0, bw=a[2][bi]||0, ww=a[3][wi]||0;
  return Math.pow(bw,kb)*Math.pow(aw*ww,ka);
}
function rollOne(c,cont){
  const cat=pickCat(c);
  const d=deliverable(cat,c,cont);
  if(!d.mass)return null;
  let r=Math.random()*d.mass,acc=0,rar=d.rows[0][0],kb=d.rows[0][2],ka=d.rows[0][3];
  for(const row of d.rows){acc+=row[1];if(r<acc){rar=row[0];kb=row[2];ka=row[3];break}}
  const shiny=Math.random()<SHINY;
  if(rar==='Regional'){
    const it=ITEMS[cat].find(x=>x[RA]==='Regional'&&x[CO]===cont);
    return it?{name:it[NM],sci:it[SC],rar,cat,shiny}:null;
  }
  const pool=ITEMS[cat].filter(x=>x[RA]===rar);
  if(!pool.length)return null;
  let pick;
  if(hasArch(cat)){
    const ws=pool.map(x=>weight(cat,x,c,kb,ka));const tot=ws.reduce((a,b)=>a+b,0);
    if(!tot)return null;
    let n=Math.random()*tot,i=0;while(i<pool.length-1&&n>=ws[i]){n-=ws[i];i++}pick=pool[i];
  } else pick=pool[Math.floor(Math.random()*pool.length)];
  return {name:pick[NM],sci:pick[SC],rar,cat,shiny};
}
function itemChance(name,cat,rar,c,cont){
  if(!c)return 0;
  const share=catShares(c,cont)[cat]||0;
  const d=deliverable(cat,c,cont);
  const row=d.rows.find(r=>r[0]===rar);
  if(!row||!d.mass)return 0;
  const tierP=row[1]/d.mass, kb=row[2], ka=row[3];
  if(rar==='Regional'){const it=ITEMS[cat].find(x=>x[RA]==='Regional'&&x[CO]===cont);return (it&&it[NM]===name)?share*tierP:0}
  const pool=ITEMS[cat].filter(x=>x[RA]===rar);
  if(!pool.length)return 0;
  if(!hasArch(cat))return share*tierP/pool.length;
  let tot=0,mine=0;
  for(const x of pool){const w=weight(cat,x,c,kb,ka);tot+=w;if(x[NM]===name)mine=w}
  return tot?share*tierP*mine/tot:0;
}
const oddsLabel=p=>p?'1 in '+Math.round(1/p).toLocaleString():'not findable here';

let HUNTMODE=localStorage.getItem('worldhunt:mode')||'normal';
if(HUNTMODE!=='hard')HUNTMODE='normal';
function modeSaveKey(){return 'worldhunt:save:v1:'+HUNTMODE}
function modeLogKey(){return 'worldhunt:logs:v1:'+HUNTMODE}
let saveTimer=null;
function saveNow(){
  try{
    localStorage.setItem(modeSaveKey(),JSON.stringify({
      v:1,mode:HUNTMODE,owned,shinies,DOMAIN,CONT,cond,
      trip:{walked:TRIP.walked,lastScan:TRIP.lastScan},
      stats:{found:foundToday},free:FREESCAN,realArea:REALAREA
    }));
    localStorage.setItem(modeLogKey(),JSON.stringify({v:1,mode:HUNTMODE,logs}));
  }catch(e){console.warn('save failed',e)}
}
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,400);
}
function load(){
  try{
    const raw=localStorage.getItem(modeSaveKey()); if(!raw)return false;
    const d=JSON.parse(raw);
    for(const k of Object.keys(ITEMS)){
      if(d.owned&&d.owned[k])owned[k]=d.owned[k];
      if(d.shinies&&d.shinies[k])shinies[k]=d.shinies[k];
    }
    const logRaw=localStorage.getItem(modeLogKey());
    if(logRaw){
      const ld=JSON.parse(logRaw);
      if(ld.logs){
        for(const k of Object.keys(ITEMS)) if(ld.logs[k]) logs[k]=ld.logs[k];
      }
    }else if(d.logs){
      /* One-time migration of legacy per-mode logs into the dedicated store. */
      for(const k of Object.keys(ITEMS)) if(d.logs[k]) logs[k]=d.logs[k];
      localStorage.setItem(modeLogKey(),JSON.stringify({v:1,mode:HUNTMODE,logs}));
    }
    if(d.DOMAIN&&DOMAINS[d.DOMAIN]){DOMAIN=d.DOMAIN;CATS=DOMAINS[DOMAIN]}
    if(d.CONT)CONT=d.CONT;
    if(d.cond)cond=d.cond;
    if(d.trip){TRIP.walked=d.trip.walked||0;TRIP.lastScan=d.trip.lastScan||Date.now()}
    if(d.stats)foundToday=d.stats.found||0;
    if(typeof d.free==='boolean')FREESCAN=d.free;
    if(typeof d.realArea==='boolean')REALAREA=d.realArea;
    return true;
  }catch(e){console.warn('load failed',e);return false}
}
function wipe(){try{localStorage.removeItem(modeSaveKey());localStorage.removeItem(modeLogKey())}catch(e){}}

/* ---------- conditions ---------- */
const BIOME_BY_CONT={Europe:{Temperate:.45,Cold:.30,Mediterranean:.25},
 'North America':{Temperate:.35,Cold:.30,Arid:.15,Mediterranean:.15,Tropical:.05},
 'South America':{Tropical:.55,Temperate:.20,Arid:.15,Mediterranean:.10},
 Africa:{Tropical:.40,Arid:.40,Mediterranean:.15,Temperate:.05},
 Asia:{Temperate:.30,Cold:.25,Tropical:.25,Arid:.20},
 Oceania:{Temperate:.40,Mediterranean:.25,Tropical:.25,Arid:.10}};
const AREA_W={Urban:.20,Forest:.18,Cultivated:.15,'Open Land':.13,Coast:.09,Wetland:.07,Barren:.06,Mountain:.06,Water:.06};
const WX_BY_BIOME={Cold:{Snow:.32,Wet:.33,Clear:.30,Extreme:.05},Temperate:{Snow:.09,Wet:.38,Clear:.45,Extreme:.08},
 Mediterranean:{Snow:.05,Wet:.28,Clear:.52,Extreme:.15},Tropical:{Wet:.50,Clear:.42,Extreme:.08},Arid:{Clear:.55,Extreme:.40,Wet:.05}};
const AREA_LABEL={Urban:'City Streets',Cultivated:'Parks & Farmland',Forest:'Woodland',
 'Open Land':'Open Country',Wetland:'Wetland',Coast:'Coastline',Barren:'Bare Rock',Mountain:'Mountain',Water:'Open Water'};
const WX_LABEL={Clear:'Clear',Wet:'Rain',Snow:'Snow',Extreme:'Heat'};
const wpick=o=>{let r=Math.random(),c=0;for(const k in o){c+=o[k];if(r<c)return k}return Object.keys(o).pop()};
function newConditions(){const biome=wpick(BIOME_BY_CONT[CONT]);return {area:wpick(AREA_W),biome,wx:wpick(WX_BY_BIOME[biome])}}
let LIVEMODE=true, LIVEINFO=null, watchId=null;
let lastAreaCell=null;
let liveRefreshBusy=false;
let lastWeatherRefresh=0;
const LIVE_REFRESH={cellPrecision:7,weatherMs:10*60000};
async function refreshLive(lat,lon,elev,opts={}){
  if(liveRefreshBusy)return;
  liveRefreshBusy=true;
  try{
    const cell=geohash(lat,lon,LIVE_REFRESH.cellPrecision);
    const refreshWeather=opts.refreshWeather!==false && (Date.now()-lastWeatherRefresh>=LIVE_REFRESH.weatherMs || !LIVEINFO);
    const c=await resolveConditions(lat,lon,elev,{refreshWeather});
    LIVEINFO=c._live; delete c._live;
    LIVEINFO.at=Date.now();
    cond=c; CONT=LIVEINFO.cont;
    lastAreaCell=LIVEINFO.cell||cell;
    if(refreshWeather){
      lastWeatherRefresh=Date.now();
      try{localStorage.setItem('worldhunt_weather_at',String(lastWeatherRefresh))}catch(e){}
      if(window.WorldHuntWeatherFreshness)WorldHuntWeatherFreshness.paint();
    }
    clearTierCache();
    renderCond(); renderGate(); save();
  }catch(e){
    LIVEINFO=LIVEINFO||{lat,lon,cont:continentOf(lat,lon)};
    LIVEINFO.err=e.message;
  }finally{ liveRefreshBusy=false; }
}
function startLocation(){
  if(!('geolocation' in navigator)){LIVEMODE=false;return}
  if(watchId!=null)try{navigator.geolocation.clearWatch(watchId)}catch(e){}
  watchId=navigator.geolocation.watchPosition(p=>{
    const {latitude:lat,longitude:lon,altitude:alt,accuracy}=p.coords;
    const accepted=addFix(lat,lon,p.timestamp,accuracy);
    if(!accepted){ renderGate(); return; }

    // Location is resolved by small geohash cells, not a 400 m movement gate.
    // This makes short walks meaningful while keeping OSM requests cached.
    const cell=geohash(lat,lon,LIVE_REFRESH.cellPrecision);
    const newCell=cell!==lastAreaCell;
    const weatherDue=!LIVEINFO || (Date.now()-lastWeatherRefresh>=LIVE_REFRESH.weatherMs);
    if(!LIVEINFO || newCell || weatherDue){
      refreshLive(lat,lon,alt||0,{refreshWeather:weatherDue||!LIVEINFO});
    }
    renderGate();
  },err=>{
    LIVEMODE=false; LIVEINFO={error:err.message};
    if(!cond)cond=newConditions();
    renderCond();
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}

/* ---------- radar terrain ---------- */
/* ============================================================
   RADAR TERRAIN  —  the silhouette under the sweep is drawn from
   the Area you are actually in, tinted by the weather.
   Seeded from the geohash cell, so a place always looks the same.
   ============================================================ */
function mulberry(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedFrom(str){let h=2166136261;for(let i=0;i<(str||'x').length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

  Clear(r){return `<rect width="400" height="400" fill="#F0D9A0" opacity="0.035"/>`},

      p+=`<path d="M0 ${y.toFixed(0)} Q 100 ${(y-6).toFixed(0)} 200 ${y.toFixed(0)} T 400 ${(y-3).toFixed(0)}" stroke="#F2C070" stroke-width="1.4" fill="none" opacity=".2"/>`}

function drawMap(area,wx,cellSeed){
  const r=mulberry(seedFrom((cellSeed||'seed')+'|'+area));
  const gen=TERRAIN[area]||TERRAIN['Open Land'];
  const fx=WEATHER_FX[wx]||WEATHER_FX.Clear;
  const el=document.getElementById('mapSvg');
  if(el)el.innerHTML=gen(r)+fx(mulberry(seedFrom((cellSeed||'seed')+'|'+wx)));
  const t=document.getElementById('ticks');
  if(t&&!t.innerHTML){
    let s='';
    for(let i=0;i<72;i++){const a=i*5*Math.PI/180,r1=i%6===0?178:184;
      s+=`<line x1="${(200+Math.cos(a)*r1).toFixed(1)}" y1="${(200+Math.sin(a)*r1).toFixed(1)}" x2="${(200+Math.cos(a)*191).toFixed(1)}" y2="${(200+Math.sin(a)*191).toFixed(1)}" stroke-width="${i%6===0?1.6:1}"/>`}
    t.innerHTML=s;
  }
}

/* ---------- render ---------- */
function renderCond(){
  drawMap(cond.area,cond.wx,(LIVEINFO&&LIVEINFO.cell)||CONT);
  document.getElementById('cArea').textContent=AREA_LABEL[cond.area]||cond.area;
  const asrc=(REALAREA&&LIVEINFO&&LIVEINFO.areaSrc)?LIVEINFO.areaSrc:(REALAREA?'':'simulated');
  document.getElementById('cBiome').textContent=cond.biome+(asrc&&asrc!=='osm'&&asrc!=='cache'?' · area '+asrc:'')+' · '+DOMAIN;
  document.getElementById('cWx').textContent=WX_LABEL[cond.wx]||cond.wx;
  const li=LIVEINFO;
  document.getElementById('cCont').textContent=
    (li&&li.weather&&li.weather.temp!=null)?Math.round(li.weather.temp)+'°C · '+CONT
    :(li&&li.error)?'location off · '+CONT:CONT;
  const sh=catShares(cond);
  const lead=Object.entries(sh).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('areaIco').innerHTML=badge('','__none__','Common',34).replace('__none__','x');
  document.getElementById('areaIco').innerHTML=
    `<svg width="26" height="26" viewBox="0 0 48 48" fill="var(${CATCOL[lead[0]]})">${silFor(lead[0],'TBL')}</svg>`;
}
function renderRing(){
  const total=CATS.reduce((a,c)=>a+ITEMS[c].length,0);
  const have=CATS.reduce((a,c)=>a+Object.keys(owned[c]).length,0);
  const el=document.getElementById('collN'); if(el)el.textContent=have+' / '+total;
}
function renderGate(){
  const g=gateProgress();
  document.getElementById('ringN').textContent=g.free?'∞':(g.ready?'GO':Math.round(g.walked));
  document.getElementById('ringLbl').textContent=g.free?'free':(g.ready?'ready':'metres');
  document.getElementById('ringArc').setAttribute('stroke-dashoffset',String(176*(1-g.p)));
  document.getElementById('ringArc').setAttribute('stroke',g.ready?'var(--phos)':'var(--dim)');
  const btn=document.getElementById('scanBtn');
  if(btn&&!scanning){ btn.disabled=!g.ready; btn.classList.toggle('armed',g.ready); }
  if(!scanning){
    document.getElementById('stripTitle').textContent=g.free?'Free scanning':(g.ready?'Ready to scan':'Keep moving');
    document.getElementById('stripBody').innerHTML=g.free
      ? `Movement gate is off for testing. <span id="collN"></span>`
      : g.ready
      ? `You have covered enough ground. <span id="collN"></span>`
      : (g.leading==='distance'
          ? `<b>${g.metresLeft} m</b> further, or wait <b>${g.minsLeft} min</b>.${g.vehicle?' Travelling by vehicle counts for less.':''}`
          : `<b>${g.minsLeft} min</b> to go, or walk <b>${g.metresLeft} m</b>.`);
    renderRing();
  }
}

/* ---------- scan ---------- */
let scanning=false;
function scan(){
  if(scanning)return; scanning=true;
  const radar=document.getElementById('radar');
  radar.classList.add('scanning');
  const btn=document.getElementById('scanBtn'); btn.disabled=true;
  const ot=btn.querySelector('.orbtxt'); if(ot)ot.textContent='···';
  document.getElementById('stripTitle').textContent='Scanning';
  document.getElementById('stripBody').textContent='Sweeping '+(AREA_LABEL[cond.area]||cond.area).toLowerCase()+' in '+(WX_LABEL[cond.wx]||cond.wx).toLowerCase()+'…';

  const n=3+Math.floor(Math.random()*13);
  const finds=[]; for(let i=0;i<n;i++)finds.push(rollOne(cond,CONT));
  const scanCond={...cond}, scanCont=CONT;
  const blips=[];
  finds.forEach((f,i)=>{
    const ang=Math.random()*360, rad=18+Math.random()*28;
    const x=50+Math.cos(ang*Math.PI/180)*rad, y=50+Math.sin(ang*Math.PI/180)*rad;
    const big=f.rar==='Ultra Rare'||f.rar==='Ancient';
    const col=`var(${f.shiny?'--shiny':RCOL[f.rar]})`;
    const d=document.createElement('div');
    d.className='blip'+(big?' mystery':'');
    d.style.left=x+'%'; d.style.top=y+'%';
    d.innerHTML=big
      ? `<span style="color:${col};text-shadow:0 0 12px ${col}">?</span>`
      : `<svg width="22" height="22" viewBox="0 0 48 48" fill="${col}" opacity=".95">${silFor(f.cat,(ITEMS[f.cat].find(x=>x[NM]===f.name)||[])[AR]||'')}</svg>`;
    radar.appendChild(d); blips.push(d);
    setTimeout(()=>d.classList.add('on'),700+i*300);
  });

  const sweepMs=Math.max(5200,760+n*300+1300);
  setTimeout(()=>{
    blips.forEach(d=>{d.style.left='50%';d.style.top='50%';d.style.opacity='0';d.style.transform='scale(.35)'});
    setTimeout(()=>{
      blips.forEach(d=>d.remove());
      radar.classList.remove('scanning');
      btn.disabled=false; {const o=btn.querySelector('.orbtxt'); if(o)o.textContent='SCAN';}
      scanning=false;
      showResults(finds,scanCond,scanCont);
    },1250);
  },sweepMs);
}

/* ---------- results ---------- */
function showResults(finds,c,cont){
  // anything already in the collection is logged straight to the encounter page;
  // anything new is held back for its own reveal, commonest first
  const news=[], dupes=[];
  finds.forEach(f=>{
    const first=!owned[f.cat][f.name];
    owned[f.cat][f.name]=(owned[f.cat][f.name]||0)+1;
    if(f.shiny)shinies[f.cat][f.name]=true;
    logCapture(f.cat,f.name,c,cont,itemChance(f.name,f.cat,f.rar,c,cont),f.shiny);
    const rec={...f,first,cond:c,cont};
    (first?news:dupes).push(rec);
  });
  news.sort((a,b)=>TIERS.indexOf(a.rar)-TIERS.indexOf(b.rar));
  const rares=news, normal=dupes;
  foundToday+=finds.length; consumeGate(); renderGate(); save();
  const byTier={};
  normal.forEach(f=>{(byTier[f.rar]=byTier[f.rar]||[]).push(f)});
  const tally={};
  finds.forEach(f=>{tally[f.rar]=(tally[f.rar]||0)+1});
  const pills='<div class="pills">'+TIERS.filter(t=>tally[t]).map(t=>
    `<span class="pill"><b style="background:var(${RCOL[t]})">${tally[t]}</b>${t}</span>`).join('')+'</div>';
  let body='';
  for(const t of TIERS){
    if(!byTier[t])continue;

/* ---------- rare reveal ---------- */
const VEIL={'Regional':1,'Ultra Rare':1,'Ancient':1};
function confetti(col,cat){
  const cols=[`var(${col})`,`var(${CATCOL[cat]||'--tree'})`,'#DCE3EA','var(--shiny)'];
  let out='';
  for(let i=0;i<34;i++){
    const x=(Math.random()*260-130).toFixed(0), d=(190+Math.random()*260).toFixed(0),
          r=(Math.random()*900-450).toFixed(0), w=(4+Math.random()*5).toFixed(1),
          h=(7+Math.random()*9).toFixed(1), dl=(Math.random()*300).toFixed(0);
    out+=`<i style="--x:${x}px;--d:${d}px;--r:${r}deg;--w:${w}px;--h:${h}px;--dl:${dl}ms;background:${cols[i%4]}"></i>`;
  }
  return `<div class="confetti">${out}</div>`;
}
function wheelSpin(h,col,done,live){
  const host=document.getElementById('burstHost');
  // Regional spins through every continent's item; the deep tiers through the whole tier
  const cands=ITEMS[h.cat].filter(x=>x[RA]===h.rar);
  if(cands.length<2){done();return}
  const TW=132, loops=Math.max(8,Math.ceil(56/cands.length));
  let strip=[];
  for(let i=0;i<loops;i++)strip=strip.concat(cands);
  let target=-1;
  for(let i=strip.length-cands.length;i<strip.length;i++) if(strip[i][NM]===h.name){target=i;break}
  if(target<0){done();return}
  const tiles=strip.map(x=>{
    const p=itemChance(x[NM],h.cat,h.rar,h.cond,h.cont);
    const lab=h.rar==='Regional'?esc(x[CO]||''):(p?oddsLabel(p):'not here');
    return `<div class="wtile"><div class="wart">${badge(x[NM],h.cat,h.rar,54)}</div>
      <div class="wnm">${esc(x[NM])}</div><div class="wch">${lab}</div></div>`;
  }).join('');
  host.innerHTML=`<div class="burst"><div class="wheelcard" style="--rc:var(${col})">
    <div class="b-tier">${h.rar==='Regional'?'Which continent':'Narrowing it down'}</div>
    <div class="wheelview" id="wview"><div class="wstrip" id="wstrip">${tiles}</div>
      <div class="wmark"></div><div class="wfade l"></div><div class="wfade r"></div></div>
    <div class="wfoot">${cands.length} possible &middot; ${esc(h.cond.area)} &middot; ${esc(h.cond.wx)}</div>
  </div></div>`;
  const view=document.getElementById('wview'), strp=document.getElementById('wstrip');
  const vw=(view&&view.offsetWidth)||300;
  const end=-(target*TW)+(vw/2-TW/2);
  if(strp){
    strp.style.transform='translateX(0px)';
    setTimeout(()=>{
      strp.style.transition='transform 6.2s cubic-bezier(.08,.58,.06,1)';
      strp.style.transform=`translateX(${end}px)`;
    },40);
  }
  setTimeout(()=>{if(live!==false)done()},6800);
}
function countdown(col,done,alive){
  const host=document.getElementById('burstHost');
  let n=3;
  const tick=()=>{
    if(alive&&!alive())return;
    if(n<1){done();return}
    host.innerHTML=`<div class="burst"><div class="countwrap" style="--rc:var(${col})">
      <div class="cring"></div><div class="cnum">${n}</div></div></div>`;
    n--;
    setTimeout(tick,780);
  };
  tick();
}
function sparkles(col){
  let out='';
  for(let i=0;i<18;i++){
    const a=(i/18)*360+Math.random()*14, d=70+Math.random()*90, s=3+Math.random()*4;
    out+=`<i style="--a:${a.toFixed(0)}deg;--d:${d.toFixed(0)}px;--s:${s.toFixed(1)}px;--dl:${(Math.random()*160).toFixed(0)}ms;background:var(${col})"></i>`;
  }
  return `<div class="sparks">${out}</div>`;
}
function revealQueue(q){
  const host=document.getElementById('burstHost');
  let live=true;
  navOpen(()=>{live=false;host.innerHTML=''});
  function step(){
    if(!live)return;
    if(!q.length){navClose();return}
    const h=q[0], col=h.shiny?'--shiny':RCOL[h.rar];
    const oc=itemChance(h.name,h.cat,h.rar,h.cond,h.cont);
    if((VEIL[h.rar]||h.shiny)&&!h.unveiled){
      const lead=h.shiny?'You found a shiny'
        :(h.rar==='Ancient'?'You found an Ancient'
        :h.rar==='Regional'?'You found a Regional':'You found an Ultra Rare');
      host.innerHTML=`<div class="burst"><div class="bcard veil" style="--rc:var(${col})">
        <button class="closex" id="bX" aria-label="Skip">&times;</button>
        <div class="sealwrap"><div class="seal">${h.shiny?'<span class="star">&#10022;</span>':'<span class="qm">?</span>'}</div></div>
        <div class="b-tier">${esc(lead)}</div>
        <div class="b-name" style="font-size:21px">${h.shiny?'Tap to reveal what it is':'Tap to unveil'}</div>
        <button id="bOk">Reveal</button>
        <div class="b-count">${q.length>1?(q.length-1)+' more new':'last one'}</div>
      </div></div>`;
      document.getElementById('bOk').onclick=()=>{h.unveiled=true;countdown(col,()=>{if(live)wheelSpin(h,col,step,live)},()=>live)};
      document.getElementById('bX').onclick=navClose;
      return;
    }
    const wasVeiled=(VEIL[h.rar]||h.shiny);
    host.innerHTML=`<div class="burst"><div class="bcard${wasVeiled?' popped celebrate':''}" style="--rc:var(${col})">
      ${wasVeiled?sparkles(col)+confetti(col,h.cat):''}
      <div class="b-badge">${badge(h.name,h.cat,h.shiny?'Shiny':h.rar,wasVeiled?122:104)}</div>
      <div class="b-tier">${h.shiny?'Shiny '+esc(h.rar):esc(h.rar)}</div>
      <div class="b-name">${esc(h.name)}</div>
      <div class="b-sci">${esc(h.sci||'')}</div>
      <div class="b-meta"><span class="new">NEW</span><span>${esc(CATNOUN[h.cat]||'')}</span></div>
      <div class="b-odds">${esc(oddsLabel(oc))}<br><span style="opacity:.7">${esc(h.cond.area)} &middot; ${esc(h.cond.biome)} &middot; ${esc(h.cond.wx)}</span></div>
      <button class="closex" id="bX" aria-label="Skip">&times;</button>
      <button id="bOk">${q.length>1?'Next':'Done'}</button>
      <div class="b-count">${q.length>1?(q.length-1)+' more new':'last one'}</div>
    </div></div>`;
    document.getElementById('bOk').onclick=()=>{q.shift();step()};
    document.getElementById('bX').onclick=navClose;
  }
  step();
}

/* ---------- item hints ---------- */
const AREA_PHRASE={Urban:'city streets and buildings',Cultivated:'parks, gardens and farmland',Forest:'woodland',
 'Open Land':'open grassland and scrub',Wetland:'wetlands, riverbanks and marshes',Coast:'the coast',
 Barren:'bare rocky ground',Mountain:'high mountain ground',Water:'open water'};
const BIOME_PHRASE={Tropical:'hot tropical regions',Arid:'dry desert country',Mediterranean:'Mediterranean climates',
 Temperate:'mild temperate regions',Cold:'cold northern and alpine country'};
const RAR_PHRASE={'Common':'Turns up often once you are somewhere it likes.',
 'Uncommon':'Shows up regularly, but you will need a few outings.',
 'Rare':'Worth going out of your way for the right conditions.',
 'Regional':'Only ever found on one continent.',
 'Ultra Rare':'Exceptionally scarce. Conditions barely tilt the odds.',
 'Ancient':'One of the rarest things in the game.'};
const rank=(v,l)=>l.map((x,i)=>[x,v[i]]).sort((a,b)=>b[1]-a[1]);
function areaLine(v){const r=rank(v,AREA),lead=r[0],second=r[1],worst=r[r.length-1];
  let s='Favours '+AREA_PHRASE[lead[0]]+'.';
  if(second[1]>=lead[1]*0.55)s=s.slice(0,-1)+', and does well in '+AREA_PHRASE[second[0]]+'.';
  if(worst[1]<=lead[1]*0.08)s+=' Almost never in '+AREA_PHRASE[worst[0]]+'.';
  return s}
function biomeLine(v){const r=rank(v,BIOME),lead=r[0],worst=r[r.length-1];
  if(lead[1]<=worst[1]*1.4)return 'Climate makes little difference.';
  let s='Likes '+BIOME_PHRASE[lead[0]]+'.';
  if(worst[1]<=lead[1]*0.2)s+=' Seldom seen in '+BIOME_PHRASE[worst[0]]+'.';
  return s}
function wxLine(v){const o={};WEATH.forEach((w,i)=>o[w]=v[i]);const out=[];
  if(o.Snow>=2)out.push('Snowfall brings it out in force.');
  else if(o.Snow<=0.35)out.push('Snow all but shuts it down.');
  if(o.Wet>=1.2)out.push('Rain and storms improve your chances.');
  if(o.Extreme>=1.2)out.push('Heat and drought suit it.');
  if(o.Clear>=1.2)out.push('Best on a clear day.');
  return out.length?out.join(' '):'Weather barely matters.'}
function hintsFor(cat,name){
  const it=ITEMS[cat].find(x=>x[NM]===name)||[];
  const rar=it[RA],out=[];
  if(rar==='Regional'){out.push('Only found in '+it[CO]+'.','Conditions do not change it — you have to be on that continent.');return {rar,lines:out,it}}
  if(hasArch(cat)){const a=(ARCH[cat]||{})[it[AR]];
    if(a)out.push(areaLine(a[1]),biomeLine(a[2]),wxLine(a[3]),'Grouped with other '+a[0].toLowerCase()+'.');
  } else {const r=CAT[cat];
    out.push(areaLine(r.a),biomeLine(r.b),wxLine(r.w),
      'Every '+(CATNOUN[cat]||'item')+' shares these conditions, so this is about where '+cat.toLowerCase()+' appear at all, not which one you get.');}
  out.push(RAR_PHRASE[rar]);
  return {rar,lines:out,it};
}
function captureLog(cat,name,total){
  const arr=(logs[cat]||{})[name]||[];
  if(!arr.length)return total?'<div class="logempty">Found before this log was kept.</div>':'';
  const shown=arr.slice().reverse();
  const firstIdx=total-arr.length+1;
  return `<div class="loghd"><b>Capture log</b>${arr.length<total?`<span>latest ${arr.length} of ${total}</span>`:`<span>${total} in total</span>`}</div>
  <ol class="caplog">${shown.map((r,i)=>{
    const num=total-i;
    const [t,ai,bi,wi,odds,lat,lon,sh,cnt]=r;
    const place=(lat!=null&&lon!=null)?`${lat.toFixed(3)}, ${lon.toFixed(3)}`:(cnt||'location not recorded');
    return `<li${sh?' class="shl"':''}>
      <div class="capn">${ORD(num)} encounter${sh?' <span class="shmark">&#10022;</span>':''}</div>
      <div class="capd">${esc(stamp(t))} &middot; ${esc(place)}</div>
      <div class="capc">${esc(AREA[ai]||'?')} &middot; ${esc(BIOME[bi]||'?')} &middot; ${esc(WEATH[wi]||'?')}${odds?` &middot; ${esc(oddsLabel(odds))}`:''}</div>
    </li>`}).join('')}</ol>`;
}
function openItem(cat,name){
  const h=hintsFor(cat,name), n=owned[cat][name]||0;
  const oc=itemChance(name,cat,h.rar,cond,CONT);
  const isShiny=!!shinies[cat][name];
  document.getElementById('itemHost').innerHTML=`<div class="sheet"><div class="sheetcard">

        <span>${esc(AREA_LABEL[cond.area]||cond.area)} &middot; ${esc(cond.biome)} &middot; ${esc(WX_LABEL[cond.wx]||cond.wx)}</span></div>
      <ul class="hints">${h.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>
      ${captureLog(cat,name,n)}
    </div>
    <div class="sheetfoot"><button class="primary" id="itemOk">Close</button></div>

      `<div class="tagbox">${LIVEINFO.areaTags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    ${REALAREA?`<button class="minibtn" id="reAreaBtn" style="margin:9px 0 0;width:100%">Re-check this spot</button>
    <button class="minibtn" id="opTestBtn" style="margin:7px 0 0;width:100%">Test OpenStreetMap connection</button>
    <div class="tagbox" id="opLog">${(OVERLOG||[]).map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
    <p style="font-size:12px;color:var(--dim);margin-top:10px">Real areas come from OpenStreetMap, cached per 150 m cell so a route only costs one lookup the first time you walk it.</p>
    <div class="setrow" style="margin-top:14px"><div><b>Scan unlock</b>
      <span>${FREESCAN?'off — scan whenever you like':`${GATE.metres} m walked, or ${GATE.minutes} min`}</span></div>
      <button class="toggle${FREESCAN?' on':''}" id="freeBtn" role="switch" aria-checked="${FREESCAN}"><i></i></button></div>
    <p style="font-size:12px;color:var(--dim);margin-top:10px">Turn the gate off to test drop rates without walking. Turn it back on for real play.</p>
    <div class="eyebrow" style="margin:20px 0 9px">Build</div>
    <div class="setrow"><div><b style="color:var(--phos)">${esc(BUILD)} · ${OVERPASS.length} mirrors</b><span id="swState">${SWERR?esc('not registered: '+SWERR):(navigator.serviceWorker&&navigator.serviceWorker.controller?'installed and running':'not registered yet')}</span></div>
      <button class="minibtn" id="updBtn">Check</button></div>
    <button class="dangerbtn" id="hardReset" style="margin-top:9px">Clear caches and reload</button>
    <p style="font-size:12px;color:var(--dim);margin-top:8px">Removes the service worker and every cached file, then reloads from the server. Your collection is not affected.</p>
    <div class="setrow" style="margin-top:9px"><div><b>Install check</b><span id="instState">tap to run</span></div>
      <button class="minibtn" id="instBtn">Run</button></div>
    <div class="eyebrow" style="margin:20px 0 9px">Conditions</div>
    <div class="setrow"><div><b>${esc(AREA_LABEL[cond.area]||cond.area)}</b><span>${esc(cond.biome)} &middot; ${esc(WX_LABEL[cond.wx]||cond.wx)}</span></div>
      <button class="minibtn" id="refreshCond">Refresh</button></div>
    <p style="font-size:12px;color:var(--dim);margin-top:12px">In the real app conditions come from your location and the weather, and change on their own. Refresh rerolls them for testing.</p>
    </div>`;
  document.getElementById('closeSet').onclick=navClose;
  document.getElementById('refreshCond').onclick=()=>{cond=newConditions();renderCond();save();openSettings(true);toast('Conditions rerolled')};
  document.getElementById('updBtn').onclick=async()=>{
    const el=document.getElementById('swState');
    const say=t=>{el.textContent=t};
    if(!('serviceWorker' in navigator)){say('this browser has no service worker');return}
    if(!self.isSecureContext){say('needs https — not a file:// page');return}
    say('checking…');
    // is sw.js actually on the server?
    let swOk=false;
    try{
      const r=await fetch('sw.js',{cache:'no-store'});
      swOk=r.ok&&/javascript|text/.test(r.headers.get('content-type')||'');
      if(!r.ok){say('sw.js missing on the server ('+r.status+')');return}
      if(!swOk){say('sw.js served as the wrong type');return}
    }catch(e){ say('could not reach sw.js'); return; }
    try{
      let reg=await navigator.serviceWorker.getRegistration();
      if(!reg){
        try{ reg=await navigator.serviceWorker.register('sw.js'); say('installed just now — reloading'); setTimeout(()=>location.reload(),900); return; }
        catch(e){ say('register failed: '+e.message); return; }
      }
      await reg.update();
      if(reg.waiting){
        say('new version ready — reloading');
        reg.waiting.postMessage('skipWaiting');
        setTimeout(()=>location.reload(),700);
      } else if(!navigator.serviceWorker.controller){
        say('installed, not controlling yet — reloading');
        setTimeout(()=>location.reload(),700);
      } else say('already the latest');
    }catch(e){ say('check failed: '+e.message) }
  };
  const di=document.getElementById('doInstall');
  if(di)di.onclick=async()=>{
    if(!installPrompt){
      document.getElementById('instHint').textContent='Chrome menu › Install and create shortcut › Install';
      return;
    }
    installPrompt.prompt();
    const r=await installPrompt.userChoice;
    installPrompt=null;
    document.getElementById('instHint').textContent=
      r.outcome==='accepted'?'Installing — check your home screen':'Install dismissed';
    di.disabled=true;
  };
  document.getElementById('hardReset').onclick=async()=>{
    try{
      if(navigator.serviceWorker){
        const regs=await navigator.serviceWorker.getRegistrations();
        for(const r of regs)await r.unregister();
      }
      if(self.caches){
        const ks=await caches.keys();
        for(const k of ks)await caches.delete(k);
      }
    }catch(e){}
    toast('Cleared — reloading');
    setTimeout(()=>location.replace(location.pathname+'?v='+Date.now()),700);
  };
  document.getElementById('instBtn').onclick=async()=>{
    const el=document.getElementById('instState'); el.textContent='checking…';
    const out=[];
    if(!self.isSecureContext)out.push('not https');
    for(const f of ['manifest.webmanifest','sw.js']){
      try{const r=await fetch(f,{cache:'no-store'}); if(!r.ok)out.push(f+' '+r.status);}
      catch(e){out.push(f+' unreachable')}
    }
    try{
      const r=await fetch('manifest.webmanifest',{cache:'no-store'});
      if(r.ok){const m=await r.json();
        if(!m.icons||!m.icons.length)out.push('manifest has no icons');
        else for(const ic of m.icons){
          if(ic.src.startsWith('data:'))continue;
          try{const ir=await fetch(ic.src,{cache:'no-store'}); if(!ir.ok)out.push(ic.src+' '+ir.status);}
          catch(e){out.push(ic.src+' unreachable')}
        }
      }
    }catch(e){out.push('manifest unreadable')}
    if(!navigator.serviceWorker||!navigator.serviceWorker.controller)out.push('sw not controlling');
    if(isStandalone())out.unshift('running as an installed app');
    else if(installPrompt)out.unshift('installable now — use the Install button above');
    else out.unshift('no install prompt offered yet');
    el.textContent=out.join(' · ');
  };
  const ot=document.getElementById('opTestBtn');
  if(ot)ot.onclick=async()=>{
    const box=document.getElementById('opLog');
    const line=t=>{box.innerHTML+=`<span>${esc(t)}</span>`};
    box.innerHTML='';
    const ctrl=navigator.serviceWorker&&navigator.serviceWorker.controller;
    line('build '+BUILD+' · '+OVERPASS.length+' mirrors · sw '+(ctrl?'controlling':'none'));
    const lat=(LIVEINFO&&LIVEINFO.lat)||51.5, lon=(LIVEINFO&&LIVEINFO.lon)||-0.1;
    const q='[out:json][timeout:10];is_in('+lat.toFixed(4)+','+lon.toFixed(4)+');out tags;';
    for(const url of OVERPASS){
      const host=url.startsWith('/')?'api (proxy)':hostOf(url);
      const t0=Date.now();
      try{
        const r=await fetch(url+'?data='+encodeURIComponent(q),{mode:'cors',credentials:'omit'});
        const ms=Date.now()-t0;
        if(!r.ok){line(host+' HTTP '+r.status+' ('+ms+'ms)');continue}
        const txt=await r.text();
        let n='?';
        try{n=(JSON.parse(txt).elements||[]).length}catch(e){line(host+' bad JSON, '+txt.length+' bytes');continue}
        line(host+' ok · '+n+' areas · '+ms+'ms');
      }catch(e){ line(host+' '+(e.name||'error')+': '+(e.message||'blocked')); }
    }
  };
  const ra=document.getElementById('reAreaBtn');
  if(ra)ra.onclick=async()=>{
    if(!LIVEINFO||LIVEINFO.lat==null){toast('No location fix yet');return}
    const cell=geohash(LIVEINFO.lat,LIVEINFO.lon,7);
    delete areaCache[cell];
    try{localStorage.setItem(AREA_CACHE_KEY,JSON.stringify(areaCache))}catch(e){}
    lastQuery=0; overpassCooldown=0; FORCEAREA=true;
    toast('Asking OpenStreetMap again…');
    await refreshLive(LIVEINFO.lat,LIVEINFO.lon,LIVEINFO.elev);
    openSettings(true);
  };
  document.getElementById('areaBtn').onclick=()=>{
    REALAREA=!REALAREA; save();
    toast(REALAREA?'Area from OpenStreetMap':'Area simulated');
    if(REALAREA&&LIVEINFO&&LIVEINFO.lat!=null){
      refreshLive(LIVEINFO.lat,LIVEINFO.lon,LIVEINFO.elev).then(()=>openSettings(true));
    } else { cond=newConditions(); renderCond(); openSettings(true); }
  };
  document.getElementById('freeBtn').onclick=()=>{
    FREESCAN=!FREESCAN; save(); renderGate(); openSettings(true);
    toast(FREESCAN?'Movement gate off — scan freely':'Movement gate on');
  };
  document.getElementById('locBtn').onclick=()=>{
    LIVEMODE=true;
    if(watchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(watchId);
    startLocation(); toast('Asking for your location…'); setTimeout(()=>openSettings(true),1200);
  };
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)}
const restored=load();
if(!cond)cond=newConditions();
renderCond(); renderGate();
startLocation();
setInterval(renderGate,10000);
if(restored)setTimeout(()=>toast('Progress restored'),600);
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.nav;
  if(!k)return;                      // the scan orb has its own handler, bound below
  if(k==='collection'){openCollection();return}
  if(k==='scan'){cond=newConditions();renderCond();toast('Conditions refreshed');return}
  if(k==='menu'){openMenu();return}
  if(k==='settings'){openSettings();return}
  toast(k.charAt(0).toUpperCase()+k.slice(1)+' — not built yet');
});
document.getElementById('scanBtn').onclick=()=>{
  if(!gateProgress().ready){toast('Not ready — keep moving');return}
  scan();
};   // bound last so nothing overwrites it

if('serviceWorker' in navigator){
  window.addEventListener('load',async()=>{
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw&&nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller) toast('Update ready — Settings › Build');
        });
      });
    }catch(e){console.warn('sw',e);SWERR=e.message}
  });
}

/* WorldHunt weather freshness */
(function(){
  function paint(){
    const el=document.getElementById('weatherFreshness');
    if(!el)return;
    const at=Number(localStorage.getItem('worldhunt_weather_at')||0);
    if(!at){
      el.textContent='Weather: waiting for live update…';
      return;
    }
    const mins=Math.max(0,Math.floor((Date.now()-at)/60000));
    el.textContent=mins>=10
      ? `Weather: last updated ${mins} min ago · stale`
      : `Weather: updated ${mins} min ago`;
  }
  window.WorldHuntWeatherFreshness={paint};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',paint,{once:true});
  else paint();
  setInterval(paint,60000);
})();
</script>
